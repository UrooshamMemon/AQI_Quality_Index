name: Hourly AQI Feature Pipeline

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  hourly-pipeline:
    runs-on: ubuntu-latest

    env:
      ENABLE_HOPSWORKS: "True"
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.1"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check environment
        run: |
          python --version
          pip show hopsworks
          pip show deltalake
          pip show pyarrow

      - name: Test Hopsworks connection
        run: |
          python -c "import hopsworks; from src.config import hopsworks_api_key, hopsworks_project; p=hopsworks.login(project=hopsworks_project, api_key_value=hopsworks_api_key); fs=p.get_feature_store(); fg=fs.get_feature_group('historical_aqi_features', version=1); print('Feature Group:', fg.name); print('Version:', fg.version); print('Time Travel:', fg.time_travel_format); print(fg.select_all().read().tail(2))"

      - name: Run hourly pipeline
        run: |
          python -m src.main